name: Reproduce Spyret bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - id: pin
        run: node -e 'console.log("revision=" + require("./ide/lib/js/spytial-pyret-capture.json").revision)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: sidprasad/spyret
          ref: ${{ steps.pin.outputs.revision }}
          path: spyret
      - run: npm ci && npm run build
        working-directory: spyret
      - run: cmp spyret/dist/spyret.global.js ide/lib/js/spytial-pyret-capture.js
