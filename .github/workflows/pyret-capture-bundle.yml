name: Reproduce Core capture bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
      - id: pin
        run: node -e 'console.log("revision=" + require("./ide/lib/js/spytial-pyret-capture.json").revision)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: sidprasad/spytial-core
          ref: ${{ steps.pin.outputs.revision }}
          path: core
      - run: npm ci --ignore-scripts && npm run build:pyret-capture
        working-directory: core
      - run: cmp core/dist/pyret-capture.global.js ide/lib/js/spytial-pyret-capture.js
