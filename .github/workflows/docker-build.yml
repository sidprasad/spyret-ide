name: Build spyret-ide Docker image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Debug workflow context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Has secrets.DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME != '' }}"
          echo "Has vars.DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME != '' }}"
          echo "Has secrets.DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}"

      - name: Resolve Docker Hub username
        id: dockerhub
        run: |
          USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$USERNAME" ]; then
            USERNAME="${{ vars.DOCKERHUB_USERNAME }}"
          fi
          if [ -z "$USERNAME" ]; then
            echo "Neither secrets.DOCKERHUB_USERNAME nor vars.DOCKERHUB_USERNAME is set."
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_TOKEN is empty or unavailable in this workflow context."
            exit 1
          fi
          echo "Docker Hub credentials are available."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.dockerhub.outputs.username }}/spyret-ide:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
